name: Deploy Google Cloud Functions
on:
  push:
    branches:
    - feature/translation2

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Detect package manager
      id: detect-package-manager
      run: |
        if [ -f "${{ github.workspace }}/yarn.lock" ]; then
          echo "::set-output name=manager::yarn"
          echo "::set-output name=command::install"
          echo "::set-output name=runner::yarn"
          exit 0
        elif [ -f "${{ github.workspace }}/package.json" ]; then
          echo "::set-output name=manager::npm"
          echo "::set-output name=command::ci"
          echo "::set-output name=runner::npx --no-install"
          exit 0
        else
          echo "Unable to determine packager manager"
          exit 1
        fi

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install dependencies
      run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v37

    - name: List all changed files
      run: |
        for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
          echo "$file was changed"
          if [[ $file == "src/translatePost.ts" ]]; then
            echo "translation file changed"
          else
            echo "some other file changed!"
          fi
        done

    - name: Check if specific function or its dependencies has changed
      id: check-changes
      run: |
        functions_changed=false
        for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
          if [[ $file == "src/translatePost.ts" || $file == "src/lib/openAIConfig.ts" || $file == "src/lib/pineConeConfig.ts" ]]; then
            functions_changed=true
            break
          fi
        done

        if [[ $functions_changed == "true" ]]; then
          echo "file changed"
          echo "deploy=true" >>$GITHUB_OUTPUT
        else
          echo "file not changed"
          echo "deploy=false" >>$GITHUB_OUTPUT
        fi

    - name: Log function changed
      if: ${{ steps.check-changes.outputs.deploy == 'true' }}
      id: log-changes
      run: echo ${{ steps.check-changes.outputs.deploy }}


